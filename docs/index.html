<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONE DEV AI</title>
<style>body{font-family:system-ui;background:#0a0a0a;color:#fff;max-width:700px;margin:auto;padding:16px}#chat{height:65vh;overflow:auto;border:1px solid #222;border-radius:12px;padding:12px;background:#111}.msg{margin:8px 0;padding:10px;border-radius:10px}.user{background:#2563eb;margin-left:15%}.ai{background:#1e1e1e}input{width:100%;padding:14px;border-radius:10px;border:1px solid #333;background:#141414;color:#fff;margin-top:10px}button{width:100%;padding:12px;margin-top:8px;border-radius:10px;border:0;background:#2563eb;color:#fff;font-weight:bold}</style></head><body>
<h1>🧠 ONE DEV AI</h1><p>Projet africain pour les devs - 100% GitHub Pages</p>
<div id="chat"></div>
<input id="q" placeholder="Tape: bsr, ton nom, que peux tu faire, python...">
<button id="send">Envoyer</button>
<script>
let chat=document.getElementById('chat');
function add(t,c='ai'){let d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
add("Salut ! Je suis One Dev AI. Tape bsr, ton nom, python, pytorch...","ai");
function getRep(q){
 q=q.toLowerCase();
 if(q.includes('bsr')||q.includes('bonjour')||q.includes('salut')||q.includes('cc')) return "Bonjour ! 👋 Je suis One Dev AI, projet africain pour aider les développeurs. Comment je peux t'aider ?";
 if(q.includes('nom')||q.includes('appelle')||q.includes('qui es tu')) return "Je m'appelle One Dev AI. Je suis un petit modèle Transformer créé pour aider les devs africains à apprendre l'IA.";
 if(q.includes('que fais')||q.includes('que peux')||q.includes('faire')||q.includes('aide')) return "Je peux :\n- Expliquer Python\n- Expliquer Pytorch / Transformer / Attention\n- Aider à coder\n- Chercher sur internet";
 if(q.includes('python')) return "Python est le langage numéro 1 en IA. Avec Pytorch tu peux créer des réseaux neuronaux. Exemple: torch.nn.Transformer";
 if(q.includes('pytorch')||q.includes('transformer')) return "Pytorch permet de créer des IA. Un Transformer utilise l'Attention pour comprendre le texte. C'est ce que mon code utilise !";
 if(q.includes('merci')) return "De rien ! Force à toi 💪";
 return "Je suis en apprentissage. Essaie : 'bonjour', 'ton nom', 'que peux tu faire', 'explique python', 'explique pytorch'";
}
document.getElementById('send').onclick=()=>{
 let i=document.getElementById('q');let q=i.value.trim();if(!q)return;i.value="";add(q,'user');setTimeout(()=>add(getRep(q),'ai'),300);
};
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('send').click()});
</script></body></html>
