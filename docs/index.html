<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONE DEV AI - Tout en Un</title>
<style>body{font-family:system-ui;background:#0a0a0a;color:#fff;max-width:750px;margin:auto;padding:12px}#chat{height:58vh;overflow:auto;border:1px solid #222;border-radius:12px;padding:12px;background:#111}.msg{margin:10px 0;padding:12px;border-radius:12px;white-space:pre-wrap}.user{background:#2563eb;margin-left:10%}.ai{background:#1e1e1e;border-left:3px solid #2563eb}img.gen{max-width:100%;border-radius:12px;margin-top:8px;border:1px solid #333}canvas{max-width:100%;border-radius:12px;margin-top:8px}#bar{display:flex;gap:6px;margin-top:10px}input{flex:1;padding:12px;border-radius:10px;border:1px solid #333;background:#141414;color:#fff}button{padding:12px;border-radius:10px;border:0;background:#2563eb;color:#fff;font-weight:bold}</style></head><body>
<h1>🧠 ONE DEV AI - Tout en Un</h1><p>Chat + Générateur d'images + Embellisseur photo</p>
<div id="chat"></div>
<div id="bar"><input id="q" placeholder="Ex: génère une photo d'un lion à Boromo"><button id="send">Envoyer</button></div>
<input type="file" id="upload" accept="image/*" style="margin-top:8px">
<div><button onclick="makeBeautiful()">✨ Rendre Belle</button><button onclick="hd()">🔍 HD x2</button><button onclick="download()">💾 Télécharger</button></div>
<canvas id="c" style="display:none"></canvas>
<script>
let chat=document.getElementById('chat'), canvas=document.getElementById('c'), ctx=canvas.getContext('2d'), img=new Image();
function add(t,c='ai',isHtml=false){let d=document.createElement('div');d.className='msg '+c;if(isHtml)d.innerHTML=t;else d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}

let KNOWLEDGE=[{q:"président burkina",a:"Président Burkina Faso: Capitaine Ibrahim Traoré (depuis 30 sept 2022)."}, {q:"président tiktok",a:"TikTok n'a pas de président. PDG: Shou Zi Chew. Maison mère ByteDance fondée par Zhang Yiming."}, {q:"bonjour",a:"Bonjour! 👋 Je suis ONE DEV AI. Tape: 'génère une photo de...' pour créer une image, ou upload une photo pour la rendre belle."}];
function normalize(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function findKnowledge(q){let nq=normalize(q);for(let k of KNOWLEDGE){if(nq.includes(normalize(k.q)))return k;}return null;}

async function searchWiki(q){try{let u=`https://fr.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&format=json&origin=*`;let r=await fetch(u);let j=await r.json();if(!j.query.search.length)return "";let t=j.query.search[0].title;let r2=await fetch(`https://fr.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(t)}`);let j2=await r2.json();return j2.extract||"";}catch(e){return "";}}

function isImageGen(q){let n=normalize(q);return n.startsWith('genere')||n.startsWith('cree une image')||n.startsWith('creer une image')||n.includes('photo de')||n.includes('image de')||n.includes('dessine')||n.startsWith('genere une photo');}

function generateImage(prompt){
 let clean=prompt.replace(/génère|crée|une photo de|une image de|dessine/gi,'').trim();
 if(!clean) clean=prompt;
 let url=`https://image.pollinations.ai/prompt/${encodeURIComponent(clean)}?width=512&height=512&nologo=true&seed=${Math.floor(Math.random()*10000)}`;
 add(`🎨 Je génère : "${clean}"<br><img class="gen" src="${url}" onload="this.scrollIntoView()">`,'ai',true);
}

document.getElementById('upload').onchange=e=>{
 let f=e.target.files[0]; if(!f)return; img.src=URL.createObjectURL(f);
 img.onload=()=>{canvas.style.display='block';canvas.width=img.width;canvas.height=img.height;ctx.drawImage(img,0,0); add('📸 Photo chargée! Clique "Rendre Belle" ou "HD x2"','ai');}
};
function makeBeautiful(){ctx.filter='brightness(1.1) contrast(1.15) saturate(1.25)';ctx.drawImage(canvas,0,0);ctx.filter='none';add('✨ Photo rendue plus belle!','ai');}
function hd(){let w=canvas.width,h=canvas.height;let tmp=document.createElement('canvas');tmp.width=w;tmp.height=h;tmp.getContext('2d').drawImage(canvas,0,0);canvas.width=w*2;canvas.height=h*2;ctx.imageSmoothingQuality='high';ctx.drawImage(tmp,0,0,w*2,h*2);add('🔍 HD x2 appliqué!','ai');}
function download(){let a=document.createElement('a');a.download='one-dev-ai.jpg';a.href=canvas.toDataURL('image/jpeg',0.9);a.click();}

async function send(){
 let i=document.getElementById('q');let q=i.value.trim();if(!q)return;i.value="";add(q,'user');
 if(isImageGen(q)){generateImage(q);return;}
 let k=findKnowledge(q); if(k){add(k.a,'ai');return;}
 add('🌐 Recherche...','ai'); let w=await searchWiki(q); if(w)add(w,'ai'); else add('Je n\'ai pas trouvé. Essaie "génère une photo de..." ou upload une photo.','ai');
}
document.getElementById('send').onclick=send;
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
add('Salut! Je suis ton outil parfait :<br>1️⃣ Tape "génère une photo d\'un lion à Boromo" -> je génère<br>2️⃣ Upload une photo -> je la rends belle<br>3️⃣ Pose une question -> je cherche','ai',true);
</script></body></html>
