<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ONE DEV AI</title><style>body{font-family:system-ui;background:#0a0a0a;color:#ededed;max-width:760px;margin:0 auto;padding:18px}#chat{height:62vh;overflow-y:auto;border:1px solid #222;border-radius:14px;padding:14px;background:#111}.msg{margin:10px 0;padding:10px 14px;border-radius:12px;white-space:pre-wrap}.user{background:#2563eb;margin-left:15%}.ai{background:#1e1e1e;border:1px solid #252525}.sys{background:#0e1a0e;border:1px dashed #2a4a2a;color:#8fbf8f;font-size:.9em}input#q{width:100%;padding:14px;border-radius:12px;border:1px solid #2a2a2a;background:#141414;color:#fff;margin-top:14px}</style></head><body><h1>🧠 ONE DEV AI</h1><p>Projet africain - Petit modèle + Recherche Web - 100% GitHub Pages</p><div id="chat"></div><input id="q" placeholder="Tape ta question... ex: bonjour"/><label><input type="checkbox" id="web" checked> 🌐 Recherche web</label><script>
let vocab=null,char_to_id=null,id_to_char=null;
fetch('./model.json').then(r=>r.json()).then(m=>{vocab=m.vocab;char_to_id=m.char_to_id;id_to_char=m.id_to_char;addMsg("✅ Modèle chargé. Je suis One Dev AI !","ai")});
function addMsg(t,w='ai'){let d=document.createElement('div');d.className='msg '+w;d.textContent=t;document.getElementById('chat').appendChild(d)}
async function searchWeb(q){try{let r=await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(q)}&format=json`);let j=await r.json();return j.AbstractText||j.RelatedTopics?.[0]?.Text||""}catch{return""}}
function generer(p){if(!vocab)return"Je suis One Dev AI, je peux aider à coder et chercher sur internet.";let o="";let ids=[...p.toLowerCase()].map(c=>char_to_id[c]).filter(x=>x!==void 0);for(let i=0;i<150;i++){let nid=ids[ids.length-1]||0;if(Math.random()<0.2)nid=Math.floor(Math.random()*vocab.length);o+=id_to_char[nid]||id_to_char[""+nid]||" ";ids.push(nid);if(o.includes("\\n")&&o.length>60)break}return o}
document.getElementById('q').addEventListener('keydown',async e=>{if(e.key!=='Enter')return;let q=e.target.value;e.target.value="";addMsg(q,'user');let web="";if(document.getElementById('web').checked){addMsg("🌐 Recherche...","sys");web=await searchWeb(q);if(web)addMsg("📄 "+web.slice(0,180),"sys")}let rep=web?`D'après web: ${web}\\n\\n`+generer(q):generer(q);addMsg(rep,'ai')});
</script></body></html>
